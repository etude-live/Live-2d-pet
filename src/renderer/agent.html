<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Claude에게 일 시키기</title>
  <style>
    :root {
      --bg: #fdfbff; --panel: #ffffff; --line: #e7e2f3; --text: #2d2a3a; --muted: #8a85a0;
      --accent: #d97757; --accent-soft: #fbeee8; --user: #eef0ff; --think: #f6f3fb; --ok: #3f9b6b; --bad: #c8504a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1c26; --panel: #26232f; --line: #3a3647; --text: #ece9f5; --muted: #9a94b0;
        --accent: #e58b6b; --accent-soft: #3a2a25; --user: #2e3150; --think: #2a2735; --ok: #6cc596; --bad: #ec7d76;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column; background: var(--bg); color: var(--text);
      font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    }
    header { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    #folder {
      flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    button {
      font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
      border-radius: 8px; padding: 4px 10px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    #log { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .msg { white-space: pre-wrap; word-break: break-word; padding: 7px 10px; border-radius: 10px; max-width: 100%; }
    .user { align-self: flex-end; background: var(--user); max-width: 85%; }
    .assistant { background: var(--panel); border: 1px solid var(--line); }
    .thought { background: var(--think); color: var(--muted); font-style: italic; border: 1px dashed var(--line); font-size: 12px; }
    .tool { color: var(--muted); font-size: 12px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tool b { color: var(--text); font-weight: 600; }
    .note { color: var(--muted); font-size: 12px; text-align: center; }
    .note.bad { color: var(--bad); }
    .ask { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }
    .ask code { display: block; margin: 6px 0; padding: 6px 8px; border-radius: 6px; background: var(--panel); white-space: pre-wrap; word-break: break-all; font: 12px/1.45 ui-monospace, Menlo, monospace; }
    .ask .row { display: flex; gap: 6px; justify-content: flex-end; }
    .ask.answered .row { display: none; }
    .ask .verdict { font-size: 12px; text-align: right; }
    footer { border-top: 1px solid var(--line); padding: 8px 10px; display: flex; gap: 6px; align-items: flex-end; }
    textarea {
      flex: 1; resize: none; min-height: 38px; max-height: 140px; padding: 8px 10px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    #settings { display: none; padding: 8px 10px; border-bottom: 1px solid var(--line); gap: 6px; flex-direction: column; }
    #settings.open { display: flex; }
    #settings label { display: flex; gap: 6px; align-items: center; }
    #settings input, #settings select { flex: 1; font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
    #settings small { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <button id="folder" title="작업 폴더 바꾸기">📁 작업 폴더 고르기</button>
    <button id="reset" title="새 대화">🆕</button>
    <button id="gear" title="설정">⚙️</button>
  </header>
  <div id="settings">
    <label>모델
      <select id="model">
        <option value="">기본값(Claude Code 설정)</option>
        <option value="claude-opus-5-5">Claude Opus 5.5</option>
        <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
        <option value="claude-haiku-5-5">Claude Haiku 5.5</option>
      </select>
    </label>
    <label>API 키 <input id="apikey" type="password" placeholder="sk-ant-… 입력 후 Enter"></label>
    <small id="keyState"></small>
  </div>
  <div id="log"></div>
  <footer>
    <textarea id="input" rows="1" placeholder="무엇을 해 드릴까요? (Enter 보내기 · Shift+Enter 줄바꿈)"></textarea>
    <button id="send" class="primary">보내기</button>
    <button id="stop" style="display:none">중지</button>
  </footer>
  <script src="agent-panel.js"></script>
</body>
</html>
