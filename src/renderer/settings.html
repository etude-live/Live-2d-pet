<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>마스코트 설정</title>
  <style>
    :root {
      --blue: #5f7cf5; --blue-soft: #8fa6ff; --pink: #ff8fbd;
      --ink: #26315e; --ink-soft: #6a7298; --paper: #ffffff; --bg: #f5f7ff; --line: #e3e8ff; --tile: #eef1ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--ink); }
    body {
      padding: 18px 18px 24px;
      font: 500 13px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    }
    .card { background: var(--paper); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; box-shadow: 0 4px 14px #5f7cf514; }
    .card h2 { font-size: 13px; font-weight: 700; color: var(--blue); margin-bottom: 10px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row + .row, .field + .field { margin-top: 10px; }
    .grow { flex: 1; min-width: 0; }
    .label { display: flex; justify-content: space-between; color: var(--ink-soft); font-size: 12px; margin-bottom: 4px; }
    .hint { font-size: 11px; color: var(--ink-soft); margin-top: 6px; }
    select, input[type="range"] { width: 100%; font: inherit; color: var(--ink); }
    select { background: var(--tile); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 8px; outline: none; }
    select:focus { border-color: var(--blue-soft); }
    input[type="range"] { accent-color: var(--blue); }
    button {
      background: var(--tile); border: 1.5px solid var(--line); color: var(--ink); border-radius: 999px;
      padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    button:hover { border-color: var(--blue-soft); }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .round { width: 30px; padding: 5px 0; }
    /* 토글 */
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
    .toggle + .toggle { margin-top: 10px; }
    .toggle small { display: block; color: var(--ink-soft); font-size: 11px; font-weight: 400; }
    .toggle input { appearance: none; flex: 0 0 38px; height: 22px; border-radius: 11px; background: #d7dcf3; position: relative; cursor: pointer; transition: background .15s; }
    .toggle input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px #0002; }
    .toggle input:checked { background: var(--blue); }
    .toggle input:checked::after { left: 19px; }
    .toggle input:disabled { opacity: .45; }
    /* 단축키 */
    .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12px; }
    kbd { font: 600 11px/1 ui-monospace, Menlo, monospace; background: var(--tile); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; color: var(--ink); white-space: nowrap; }
    .keys span { color: var(--ink-soft); }
    .usage { font-size: 12px; color: var(--ink-soft); }
    /* 모델 타일 */
    .model-grid { display: grid; grid-template-columns: repeat(auto-fill, 84px); gap: 8px; max-height: 260px; overflow-y: auto; padding: 8px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; }
    .model-grid .group { grid-column: 1 / -1; font-size: 11px; color: var(--ink-soft); }
    .model-tile { background: none; border: 1.5px solid transparent; border-radius: 12px; padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; min-width: 0; white-space: normal; }
    .model-tile:hover { background: var(--tile); }
    .model-tile.selected { border-color: var(--blue); background: #e6ebff; }
    .model-tile.drop { border: 1.5px dashed var(--blue); }
    .model-tile .thumb { width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #e6eaff; display: grid; place-items: center; }
    .model-tile .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .model-tile .name { width: 100%; text-align: center; line-height: 1.3; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .initial { font-size: 24px; font-weight: 700; color: var(--blue-soft); }
    .mini-thumb { flex: 0 0 34px; height: 34px; border-radius: 10px; overflow: hidden; background: #e6eaff; display: grid; place-items: center; }
    .mini-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .mini-thumb .initial { font-size: 15px; }
    .foot { display: flex; flex-wrap: wrap; gap: 6px; }
    .ver { color: var(--ink-soft); font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🤖 Claude</h2>
    <label class="toggle"><span>Claude 모드<small>끄면 말투대로 혼잣말하는 피규어가 돼요 (토큰 거의 0)</small></span><input type="checkbox" id="claude-check"></label>
    <label class="toggle" id="study-row"><span>같이 공부<small>Claude 앱 대화를 보고 한두 마디 거들어요 (Mac)</small></span><input type="checkbox" id="study-check"></label>
    <div class="field" style="margin-top:12px">
      <div class="label"><span>대화 모델</span><span class="usage" id="usage"></span></div>
      <select id="model-select"></select>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btn-persona">🗣 말투(지침)</button>
      <button id="btn-memory">🧠 기억</button>
      <button id="btn-login">🔑 로그인</button>
    </div>
  </div>

  <div class="card">
    <h2>👗 캐릭터</h2>
    <div class="row">
      <div id="character-thumb" class="mini-thumb"></div>
      <select id="character-select" class="grow"></select>
      <button id="btn-add-character" class="round" title="캐릭터 추가">＋</button>
      <button id="btn-remove-character" class="round" title="이 캐릭터 삭제">−</button>
    </div>
    <div class="field" style="margin-top:12px">
      <div class="label"><span>모델</span><span><button id="btn-import-model" title="ZIP / .vrm / 폴더. 캐릭터 위에 드롭해도 돼요">가져오기…</button></span></div>
      <div id="model-grid" class="model-grid"></div>
      <div class="hint">타일에 이미지를 드롭하면 썸네일이 돼요</div>
      <div class="row" style="margin-top:8px">
        <button id="btn-select-file">파일 직접 열기…</button>
        <button id="btn-remove-model">라이브러리에서 삭제</button>
      </div>
    </div>
    <div class="field">
      <div class="label"><span>크기</span><span id="height-val"></span></div>
      <input type="range" id="height-range" min="200" max="1000" step="10">
    </div>
    <div class="field">
      <div class="label"><span>불투명도</span><span id="opacity-val"></span></div>
      <input type="range" id="opacity-range" min="0.2" max="1.0" step="0.05">
    </div>
    <label class="toggle" style="margin-top:12px"><span>시선 추적<small>마우스를 눈으로 따라가요</small></span><input type="checkbox" id="gaze-check"></label>
  </div>

  <div class="card">
    <h2>⌨️ 단축키</h2>
    <div class="keys" id="keys"></div>
  </div>

  <div class="card">
    <h2>ℹ️ 앱</h2>
    <div class="foot">
      <button id="btn-update">⬆️ 업데이트 확인</button>
      <button id="btn-open-library">📂 모델 폴더</button>
      <button id="btn-open-data">📂 설정 폴더</button>
      <button id="btn-credits">📜 크레딧</button>
    </div>
    <div class="ver" id="ver"></div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
