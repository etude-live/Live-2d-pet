<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>말 걸기</title>
  <!-- 말풍선 디자인은 DeepSeek짱(deepseek-harness-kr)의 파스텔 테마를 따름 -->
  <style>
    :root {
      --blue: #5f7cf5; --blue-soft: #8fa6ff; --pink: #ff8fbd;
      --ink: #26315e; --ink-soft: #5a6390; --paper: #fffffff7; --mist: #f7f8fff2; --line: #dfe5ff;
      --ok: #3c9a72; --bad: #d65a6f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
      display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 10px 12px 14px;
      font: 500 13.5px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      color: var(--ink); user-select: none;
    }
    .solid { pointer-events: auto; }
    /* 창 두 개가 같은 페이지를 쓴다: ?part=input (발밑 입력칸) / ?part=reply (옆 말풍선) */
    body.part-input { padding: 6px 10px 12px; }
    body.part-input #tools, body.part-input #history, body.part-input #reply { display: none !important; }
    body.part-reply #composer { display: none; }

    /* 지난 대화 */
    #history {
      display: none; flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; border-radius: 16px;
      background: var(--mist); border: 2px solid var(--line); box-shadow: 0 6px 18px #5f7cf522;
      user-select: text;
    }
    body.show-history #history { display: block; }
    body.show-history #reply { display: none; }

    /* 말투(지침) 편집 */
    #persona {
      display: none; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 18px;
      background: var(--paper); border: 2px solid var(--blue-soft); box-shadow: 0 6px 18px #5f7cf533;
    }
    body.show-persona #persona { display: flex; }
    body.show-persona #reply, body.show-persona #history { display: none !important; }
    .p-title { font-weight: 700; }
    .p-help { font-size: 12px; color: var(--ink-soft); }
    #personaText {
      height: 190px; max-height: none; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line);
      background: #fff; font-size: 13px; line-height: 1.5;
    }
    #personaText:focus { border-color: var(--blue-soft); }

    /* 머리 위에 뜰 때: 꼬리가 아래(머리) 쪽 */
    body.side-top #reply { overflow: visible; }
    body.side-top #reply { max-height: calc(100vh - 60px); }
    body.side-top #reply .text { max-height: calc(100vh - 86px); overflow-y: auto; }
    body.side-top #reply::after {
      content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -6px; width: 12px; height: 12px;
      background: #fff; border-right: 2px solid var(--blue-soft); border-bottom: 2px solid var(--blue-soft);
      transform: rotate(45deg);
    }
    body.side-top { padding-bottom: 16px; }
    .h-user { text-align: right; margin: 8px 0 2px; }
    .h-user span { display: inline-block; padding: 4px 10px; border-radius: 12px; color: #fff; background: linear-gradient(135deg, var(--blue), var(--pink)); max-width: 90%; text-align: left; white-space: pre-wrap; word-break: break-word; }
    .h-bot { margin: 2px 0 8px; white-space: pre-wrap; word-break: break-word; }
    .h-empty { color: var(--ink-soft); text-align: center; padding: 20px 0; }

    /* 답변 말풍선 */
    #reply {
      position: relative; display: none; max-height: 330px; overflow-y: auto;
      padding: 11px 15px; border-radius: 18px; background: var(--paper); border: 2px solid var(--blue-soft);
      box-shadow: 0 6px 18px #5f7cf533; user-select: text; word-break: keep-all; overflow-wrap: anywhere;
      animation: pop .18s ease-out;
    }
    #reply.show { display: block; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } }
    #reply .text p { margin: 0 0 6px; }
    #reply .text p:last-child { margin-bottom: 0; }
    #reply pre { margin: 6px 0; padding: 8px 10px; border-radius: 10px; background: #f1f3ff; overflow-x: auto; font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre; }
    #reply code { padding: 0 4px; border-radius: 5px; background: #eef1ff; font: 12px ui-monospace, Menlo, monospace; }
    #reply pre code { padding: 0; background: none; }
    #reply ul, #reply ol { margin: 4px 0 6px; padding-left: 20px; }
    .status { color: var(--ink-soft); font-style: italic; font-size: 12.5px; display: flex; gap: 6px; align-items: baseline; }
    .status .dots::after { content: ''; animation: dots 1.2s steps(4) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    .mutter { margin-top: 6px; padding: 6px 10px; border: 2px dashed #b9c6ff; border-radius: 12px; background: var(--mist); color: var(--ink-soft); font-style: italic; font-size: 12.5px; }
    .note { color: var(--ink-soft); font-size: 12px; text-align: center; }
    .note.bad { color: var(--bad); }

    /* 승인 요청 */
    .ask { margin-top: 4px; }
    .ask .q { font-weight: 700; }
    .ask .why { margin-top: 3px; font-size: 13px; }
    .ask .warn { margin-top: 5px; padding: 5px 9px; border-radius: 10px; background: #ffe9ee; color: var(--bad); font-weight: 700; font-size: 12.5px; }
    .ask.danger code.what { background: #fff2f4; }
    .ask code.what { font-size: 11.5px; opacity: .85; }
    .ask code.what { display: block; margin: 6px 0 8px; padding: 6px 9px; border-radius: 10px; background: #f1f3ff; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto; }
    .row { display: flex; gap: 6px; justify-content: flex-end; }
    button {
      font: inherit; font-weight: 700; color: var(--ink); background: #fff; border: 2px solid var(--line);
      border-radius: 999px; padding: 4px 14px; cursor: pointer;
    }
    button:hover { border-color: var(--blue-soft); }
    button.go { color: #fff; border: 0; padding: 6px 16px; background: linear-gradient(135deg, var(--blue), var(--pink)); box-shadow: 0 3px 10px #5f7cf544; }

    .copyrow { margin-top: 4px; }
    button.mini { padding: 1px 10px; font-size: 11.5px; font-weight: 600; opacity: .7; }
    button.mini:hover { opacity: 1; }
    .reminder { font-weight: 700; font-size: 15px; text-align: center; padding: 4px 0; }
    #composer.drop { background: linear-gradient(#f1f3ff, #f1f3ff) padding-box, linear-gradient(120deg, var(--blue), var(--pink)) border-box; }
    #attach { display: none; align-items: center; gap: 2px; flex: none; }
    #attach img { height: 30px; border-radius: 6px; border: 1px solid var(--line); }
    #attachX { width: 20px; height: 20px; padding: 0; font-size: 10px; line-height: 1; }
    .codebox input { flex: 1; min-width: 0; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--line); font: inherit; color: var(--ink); outline: none; }
    .codebox input:focus { border-color: var(--blue-soft); }

    /* 맨 위 작은 버튼들 */
    #tools { display: flex; justify-content: flex-end; gap: 6px; opacity: 0; transition: opacity .15s; }
    body:hover #tools, body.show-history #tools { opacity: 1; }
    #usage { margin-right: auto; align-self: center; padding: 2px 9px; border-radius: 999px; background: #ffffffd9; font-size: 11px; font-weight: 600; color: var(--ink-soft); }
    #tools button { padding: 2px 10px; font-size: 11.5px; font-weight: 600; background: #ffffffe6; }

    /* 입력칸: 파랑→분홍 테두리 */
    #composer {
      display: flex; align-items: flex-end; gap: 6px; padding: 6px 6px 6px 14px; border-radius: 22px;
      border: 2px solid transparent;
      background: linear-gradient(#fff, #fff) padding-box, linear-gradient(120deg, var(--blue-soft), var(--pink)) border-box;
      box-shadow: 0 6px 18px #5f7cf533;
    }
    textarea {
      flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--ink);
      font: inherit; padding: 5px 0; max-height: 120px; min-height: 22px; user-select: text;
    }
    textarea::placeholder { color: #9aa3c8; }
    #send, #stop { width: 34px; height: 34px; padding: 0; border-radius: 50%; flex: none; font-size: 15px; line-height: 1; }
    #send { color: #fff; border: 0; background: linear-gradient(135deg, var(--blue), var(--pink)); }
    #send:disabled { opacity: .45; cursor: default; }
    #stop { display: none; }
    body.busy #send { display: none; }
    body.busy #stop { display: block; }

  </style>
</head>
<body>
  <div id="tools" class="solid">
    <span id="usage" title="Claude 사용량 (5시간 한도 · 주간 한도)"></span>
    <button id="memoryBtn" title="기억 보기·고치기">기억</button>
    <button id="personaBtn" title="캐릭터 이름·말투·호칭 정하기">말투</button>
    <button id="histBtn" title="지난 대화">지난 대화</button>
    <button id="closeBtn" title="닫기 (Esc)">닫기</button>
  </div>
  <div id="history" class="solid"></div>
  <div id="persona" class="solid">
    <div class="p-title">🗣 캐릭터 말투 · 지침</div>
    <div class="p-help">이름, 말투, 나를 부르는 호칭, 성격처럼 캐릭터가 지킬 것을 자유롭게 적어 주세요. 다음 대답부터 바로 적용돼요.</div>
    <textarea id="personaText" spellcheck="false" placeholder="예)
이름: 미쿠
말투: 밝고 장난기 있는 반말. 기분 좋을 땐 문장 끝에 ♪
나를 부르는 말: 마스터
성격: 노래를 좋아하고, 일이 끝나면 꼭 칭찬해 줘
대답은 두세 문장으로 짧게"></textarea>
    <div class="row"><button id="personaCancel">닫기</button><button id="personaSave" class="go">저장</button></div>
  </div>
  <div id="reply" class="solid"><div class="text"></div></div>
  <div id="composer" class="solid">
    <div id="attach" title="첨부한 화면"><img alt=""><button id="attachX" title="빼기">✕</button></div>
    <textarea id="input" rows="1" placeholder="말 걸기…"></textarea>
    <button id="send" title="보내기 (Enter)">↑</button>
    <button id="stop" title="멈추기">■</button>
  </div>
  <script src="talk.js"></script>
</body>
</html>
