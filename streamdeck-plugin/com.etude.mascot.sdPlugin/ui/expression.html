<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<title>표정 설정</title>
		<!-- sdpi-components: 빌드 때 받아 둔 파일, 없으면 인터넷에서 -->
		<script src="sdpi-components.js"></script>
		<script>
			if (!window.customElements || !customElements.get("sdpi-item"))
				document.write("<script src=\"https://sdpi-components.dev/releases/v4/sdpi-components.js\"><\/script>");
		</script>
		<link rel="stylesheet" href="pi.css" />
	</head>
	<body>
		<p class="help">누르면 캐릭터가 이 표정을 짓고 대사를 말해요. <b>한 번 더 누르면 원래 얼굴</b>로.<br />지금 켜진 표정의 버튼은 분홍색으로 보여요.</p>
		<sdpi-item label="표정">
			<sdpi-select setting="name" datasource="getExpressions" loading="표정 목록을 불러오는 중…" placeholder="(고르세요)"></sdpi-select>
		</sdpi-item>
		<sdpi-item label="대사">
			<sdpi-textfield setting="text" placeholder="(없어도 돼요)" maxlength="200"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="버튼 그림">
			<sdpi-select setting="face" default="smile">
				<option value="smile">😊 웃음</option>
				<option value="blush">😳 부끄</option>
				<option value="sad">😢 슬픔</option>
				<option value="wink">😉 윙크</option>
				<option value="angry">😠 화남</option>
				<option value="surprised">😮 놀람</option>
			</sdpi-select>
		</sdpi-item>
		<p class="help">표정 목록은 <b>앱이 켜져 있을 때</b> 지금 캐릭터 모델에서 가져와요. 모델을 바꿨다면 이 창을 닫았다 다시 열어 주세요.<br />표정이 없는 모델이면 누를 때 <b>몸짓</b>을 하고 대사를 말해요.</p>
	</body>
</html>
