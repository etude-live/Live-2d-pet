<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<title>이거 뭐야 설정</title>
		<!-- sdpi-components: 빌드 때 받아 둔 파일, 없으면 인터넷에서 -->
		<script src="sdpi-components.js"></script>
		<script>
			if (!window.customElements || !customElements.get("sdpi-item"))
				document.write("<script src=\"https://sdpi-components.dev/releases/v4/sdpi-components.js\"><\/script>");
		</script>
		<link rel="stylesheet" href="pi.css" />
	</head>
	<body>
		<p class="help">누르면 화면을 찍어 캐릭터에게 보여 줘요.</p>
		<sdpi-item label="질문">
			<sdpi-textfield setting="question" default="이 화면 설명해 줘" placeholder="(비워 두면 첨부만)"></sdpi-textfield>
		</sdpi-item>
		<p class="help">질문을 <b>비워 두면</b> 바로 묻지 않고 입력칸에 그림만 붙여 둬요.<br />처음엔 Mac 의 <b>화면 기록 권한</b>이 필요해요 (시스템 설정 → 개인정보 보호 및 보안 → 화면 및 시스템 오디오 기록).</p>
	</body>
</html>
