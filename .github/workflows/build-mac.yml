# 맥(Apple Silicon)용 앱을 빌드해서 내려받을 수 있게 올린다.
# Actions 탭 → "Build macOS app" → 실행 결과 아래 Artifacts 에서 zip 을 받는다.
#
# - Live2D Cubism Core 는 저장소에 넣지 않고(라이선스), 빌드할 때 공식 CDN 에서 받는다.
#   pixi-live2d-display 0.4.0 은 Core 6.x 와 맞지 않으므로 5.x 를 쓴다 (vendor/README.md).
# - 모델(하루 등)은 넣지 않는다. 앱을 켠 뒤 ZIP/폴더를 캐릭터에 드롭해서 가져온다.
# - 정식 서명이 없어 ad-hoc 서명만 한다. 처음 열 때 "확인되지 않은 개발자" 경고가 뜬다.
name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [claude/stoic-davinci-mocgrx, main]
    paths: ['src/**', 'package.json', 'package-lock.json', 'assets/**', 'build/**', 'tools/**', '.github/workflows/build-mac.yml']

permissions:
  contents: write   # 릴리스 만들기 (앱 안 자동 업데이트가 여기서 받아 감)

jobs:
  mac-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 버전의 PATCH 를 커밋 수로 셈

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 버전 = package.json 의 MAJOR.MINOR + PATCH(그 MAJOR.MINOR 로 바꾼 커밋 뒤의 커밋 수).
      # 빌드 번호(run_number)는 업데이트 비교용으로 따로 둔다 (릴리스 태그 build-N).
      - name: Stamp version and build number
        run: |
          BASE=$(git log -G'"version"' --format=%H -1 -- package.json)
          PATCH=$(git rev-list --count "$BASE"..HEAD)
          node -e "const f='package.json',p=require('./'+f);const [a,b]=p.version.split('.');p.version=a+'.'+b+'.'+$PATCH;p.buildNumber=${{ github.run_number }};require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n');console.log('v'+p.version,'build',p.buildNumber)"

      - name: Download Live2D Cubism Core (5.x)
        run: |
          curl -fsSL -o vendor/live2dcubismcore.min.js https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js
          head -c 300 vendor/live2dcubismcore.min.js | grep -o 'Version [0-9.]*' || true

      - name: Build Claude window reader (Swift)
        run: |
          mkdir -p build/bin
          swiftc -O tools/ax-read.swift -o build/bin/ax-read
          ls -l build/bin

      - name: Build app (unpacked)
        run: npx electron-builder --mac dir --arm64 --publish never

      # 저장소 Secrets 에 고정 인증서(MAC_CERT_P12, MAC_CERT_PASSWORD)가 있으면 그걸로 서명한다.
      # 서명이 매번 같아야 Mac 이 업데이트 뒤에도 같은 앱으로 보고 권한(화면 녹화·손쉬운 사용)을 유지한다.
      # 없으면 예전처럼 ad-hoc 서명 (업데이트마다 권한이 풀림).
      - name: Sign and check
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          APP="$(ls -d dist/mac-arm64/*.app | head -1)"
          echo "APP=$APP" >> "$GITHUB_ENV"
          if [ -n "$P12" ]; then
            KC="$RUNNER_TEMP/sign.keychain-db"
            security create-keychain -p ci "$KC"
            security set-keychain-settings "$KC"
            security unlock-keychain -p ci "$KC"
            echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            security find-identity -p codesigning "$KC"
            ID=$(security find-identity -p codesigning "$KC" | awk '/^ *1\)/{print $2; exit}')
            echo "고정 서명: $ID"
            codesign --force --deep --sign "$ID" --keychain "$KC" "$APP"
          else
            echo "고정 인증서가 없어 ad-hoc 서명"
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          codesign -d -r- "$APP"
          # Claude 에이전트 실행 파일이 asar 밖에 풀려 있어야 실행할 수 있다
          EXE="$APP/Contents/Resources/app.asar.unpacked/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/claude"
          test -x "$EXE" && "$EXE" --version
          test -x "$APP/Contents/Resources/bin/ax-read"

      - name: Zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ditto -c -k --keepParent "$APP" "dist/live2d-desktop-mascot-ko-claude-$VERSION-mac-arm64.zip"

      - name: Publish release (for in-app update)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          git log -1 --format='%s%n%n%b' | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          V=$(node -p "require('./package.json').version")
          gh release create "build-$N" dist/*.zip --title "v$V (빌드 $N)" --notes-file notes.txt --target "$GITHUB_SHA" --latest

      - uses: actions/upload-artifact@v4
        with:
          name: live2d-desktop-mascot-mac-arm64
          path: dist/*.zip
          retention-days: 14
